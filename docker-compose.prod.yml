# ============================================
# AI Drama Video - Docker Compose (Ubuntu 生产部署)
# ============================================
# 使用方式:
#   1. 复制 .env.production 为 .env 并修改配置
#   2. docker compose -f docker-compose.prod.yml up -d --build
# ============================================

services:
  # ---------- 基础设施 ----------
  postgres:
    image: postgres:16-alpine
    container_name: aidrama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE:-aidrama}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME:-postgres} -d ${PG_DATABASE:-aidrama}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aidrama-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Next.js 全栈应用 (本地构建) ----------
  web:
    build:
      context: ./ai-fusion-video-web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
    image: aidrama-web:${TAG:-latest}
    container_name: aidrama-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3008}:3000"
      - "${SYNC_PORT:-5858}:5858"
    environment:
      DATABASE_URL: postgresql://${PG_USERNAME:-postgres}:${PG_PASSWORD}@postgres:5432/${PG_DATABASE:-aidrama}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY:-}
      HOSTNAME: "0.0.0.0"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: aidrama-network
